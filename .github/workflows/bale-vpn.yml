                      "users": [
                        {
                          "encryption": "none",
                          "id": "d18940b5-465a-62eb-d04e-455d00000004",
                          "level": 8
                        }
                      ]
                    }
                  ]
                },
                "streamSettings": {
                  "finalmask": {
                    "tcp": [
