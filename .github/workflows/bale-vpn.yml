      - name: Start Xray with fallback
        id: xray
        shell: bash
        run: |
          set -u

          cd "$HOME/bale-vpn"

          DEFAULT_ROUTE="$(ip -4 route show default | head -n 1 || true)"
          printf '%s' "$DEFAULT_ROUTE" > default-route.txt

          cleanup_xray() {
            if [ -f xray.pid ]; then
              PID="$(cat xray.pid 2>/dev/null || true)"

              if [ -n "$PID" ]; then
                kill "$PID" 2>/dev/null || true
                sleep 2
                kill -9 "$PID" 2>/dev/null || true
              fi
            fi

            rm -f xray.pid

            ip link delete xray0 2>/dev/null || true

            if [ -n "$DEFAULT_ROUTE" ]; then
              ip route replace $DEFAULT_ROUTE 2>/dev/null || true
            fi
          }

          start_and_test() {
            CONFIG="$1"
            SOCKS_PORT="$2"
            LABEL="$3"

            rm -f xray.pid
            rm -f xray-access.log
            rm -f xray-error.log
            rm -f xray-runtime.log

            ./log.sh INFO "Starting ${LABEL} Xray client."

            ./xray run \
              -c "$CONFIG" \
              > xray-runtime.log 2>&1 &

            PID=$!

            echo "$PID" > xray.pid

            sleep 5

            if ! kill -0 "$PID" 2>/dev/null; then
              ./log.sh ERROR "${LABEL} Xray process exited during startup."

              echo "----- ${LABEL} Xray runtime log -----"
              tail -n 150 xray-runtime.log 2>/dev/null || true

              return 1
            fi

            for attempt in 1 2 3 4 5; do
              echo "Xray connectivity test ${LABEL}, attempt ${attempt}/5..."

              TEST_IP=""

              for URL in \
                "https://api.ipify.org" \
                "https://ifconfig.me/ip" \
                "https://icanhazip.com"
              do
                VALUE="$(
                  curl -4 \
                    -fsS \
                    --connect-timeout 5 \
                    --max-time 15 \
                    --socks5-hostname "127.0.0.1:${SOCKS_PORT}" \
                    "$URL" 2>/tmp/xray-curl.err |
                  tr -d '[:space:]' || true
                )"

                if echo "$VALUE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
                  TEST_IP="$VALUE"
                  break
                fi
              done

              if [ -n "$TEST_IP" ]; then
                echo "Xray ${LABEL} exit IP: ${TEST_IP}"

                ./log.sh INFO \
                  "${LABEL} Xray connectivity verified. Exit IP: ${TEST_IP}."

                printf '%s' "${LABEL}" > xray-mode.txt
                printf '%s' "${TEST_IP}" > xray-egress-ip.txt

                return 0
              fi

              if ! kill -0 "$PID" 2>/dev/null; then
                ./log.sh ERROR "${LABEL} Xray process stopped during connectivity testing."
                break
              fi

              sleep 3
            done

            ./log.sh ERROR "${LABEL} Xray connectivity test failed."

            echo "----- ${LABEL} Xray runtime log -----"
            tail -n 150 xray-runtime.log 2>/dev/null || true

            echo "----- ${LABEL} Xray error log -----"
            tail -n 150 xray-error.log 2>/dev/null || true

            cleanup_xray

            return 1
          }

          PROXY_SELECTED=0

          if [ "$(cat xray-available 2>/dev/null || echo 0)" = "1" ] &&
             [ ! -f primary-config-invalid ]; then

            if start_and_test \
              xray-primary.json \
              58254 \
              "PRIMARY"; then

              PROXY_SELECTED=1

              echo "Primary Xray selected."

            else
              ./log.sh WARN \
                "Primary Xray unavailable. Switching to fallback configuration."
            fi

          else
            ./log.sh WARN \
              "Primary Xray is unavailable or invalid. Switching to fallback configuration."
          fi

          if [ "$PROXY_SELECTED" -eq 0 ]; then

            if [ "$(cat xray-available 2>/dev/null || echo 0)" = "1" ] &&
               [ ! -f fallback-config-invalid ]; then

              if start_and_test \
                xray-fallback.json \
                58256 \
                "FALLBACK"; then

                PROXY_SELECTED=1

                echo "Fallback Xray selected."

              else
                ./log.sh WARN \
                  "Fallback Xray unavailable. Switching to DIRECT internet mode."
              fi

            else
              ./log.sh WARN \
                "Fallback Xray is unavailable or invalid. Switching to DIRECT internet mode."
            fi
          fi

          if [ "$PROXY_SELECTED" -eq 0 ]; then
            cleanup_xray

            printf '%s' "DIRECT" > xray-mode.txt
            printf '%s' "" > xray-egress-ip.txt

            ./log.sh WARN \
              "Both Xray configurations are unavailable. DIRECT internet mode is active."
          fi

          MODE="$(cat xray-mode.txt)"

          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"

          echo "Xray mode: ${MODE}"

          ip -4 route get 1.1.1.1 || true

          ./log.sh INFO \
            "Network mode selected: ${MODE}."

      - name: Get Active Egress IP
        id: egress-ip
        shell: bash
        run: |
          set -u

          cd "$HOME/bale-vpn"

          MODE="$(cat xray-mode.txt 2>/dev/null || echo DIRECT)"

          case "$MODE" in
            PRIMARY)
              SOCKS_PORT="58254"
              ;;
            FALLBACK)
              SOCKS_PORT="58256"
              ;;
            *)
              SOCKS_PORT=""
              ;;
          esac

          EGRESS_IP=""

          if [ -n "$SOCKS_PORT" ]; then
            ./log.sh INFO \
              "Checking active Xray egress IP through SOCKS ${SOCKS_PORT}."

            for URL in \
              "https://api.ipify.org" \
              "https://ifconfig.me/ip" \
              "https://icanhazip.com"
            do
              VALUE="$(
                curl -4 \
                  -fsS \
                  --connect-timeout 5 \
                  --max-time 15 \
                  --socks5-hostname "127.0.0.1:${SOCKS_PORT}" \
                  "$URL" 2>/dev/null |
                tr -d '[:space:]' || true
              )"

              if echo "$VALUE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
                EGRESS_IP="$VALUE"
                break
              fi
            done
          else
            ./log.sh INFO "Checking DIRECT internet egress IP."

            for URL in \
              "https://api.ipify.org" \
              "https://ifconfig.me/ip" \
              "https://icanhazip.com"
            do
              VALUE="$(
                curl -4 \
                  -fsS \
                  --connect-timeout 5 \
                  --max-time 15 \
                  "$URL" 2>/dev/null |
                tr -d '[:space:]' || true
              )"

              if echo "$VALUE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
                EGRESS_IP="$VALUE"
                break
              fi
            done
          fi

          if [ -z "$EGRESS_IP" ]; then
            EGRESS_IP="unknown"
            ./log.sh WARN \
              "Active egress IP could not be determined."
          else
            ./log.sh INFO \
              "Active network egress IPv4: ${EGRESS_IP}."
          fi

          printf '%s' "$EGRESS_IP" > active-egress-ip.txt

          echo "ip=${EGRESS_IP}" >> "$GITHUB_OUTPUT"

      - name: Notify Controller - Network Ready
        if: ${{ inputs.controller_callback_url != '' }}
        shell: bash
        env:
          CALLBACK_URL: ${{ inputs.controller_callback_url }}
          RUN_ID: ${{ inputs.controller_run_id }}
        run: |
          set -u

          cd "$HOME/bale-vpn"

          MODE="$(cat xray-mode.txt 2>/dev/null || echo DIRECT)"
          EGRESS_IP="$(cat active-egress-ip.txt 2>/dev/null || echo unknown)"
          RUNNER_IP="${{ steps.runner-ip.outputs.ip }}"

          ./log.sh INFO \
            "Network ready. Mode=${MODE}, RunnerIP=${RUNNER_IP}, EgressIP=${EGRESS_IP}."

          curl -fsS \
            --max-time 20 \
            -X POST \
            -H "Content-Type: application/json" \
            "$CALLBACK_URL" \
            -d "$(jq -n \
              --arg event "network_ready" \
              --arg run_id "$RUN_ID" \
              --arg github_run_id "${GITHUB_RUN_ID}" \
              --arg runner_ip "$RUNNER_IP" \
              --arg egress_ip "$EGRESS_IP" \
              --arg mode "$MODE" \
              '{
                event:$event,
                controller_run_id:$run_id,
                github_run_id:$github_run_id,
                runner_ip:$runner_ip,
                egress_ip:$egress_ip,
                mode:$mode
              }')" \
            || echo "Controller callback failed."

      - name: Start BaleVPN
        id: balevpn
        shell: bash
        run: |
          set -e

          cd "$HOME/bale-vpn"

          ./log.sh INFO "Starting BaleVPN server."

          ./bale-vpn-headless-linux-x86_64 server \
            --nat-mode userspace \
            > bale-vpn.log 2>&1 &

          PID=$!

          echo "$PID" > bale-vpn.pid

          sleep 8

          if ! kill -0 "$PID" 2>/dev/null; then
            ./log.sh ERROR "BaleVPN failed to start."

            echo "----- BaleVPN startup log -----"
            cat bale-vpn.log || true

            exit 1
          fi

          echo "PID: $PID"

          ./log.sh INFO "BaleVPN started successfully."

      - name: Notify Controller - VPN Started
        if: ${{ inputs.controller_callback_url != '' }}
        shell: bash
        env:
          CALLBACK_URL: ${{ inputs.controller_callback_url }}
          RUN_ID: ${{ inputs.controller_run_id }}
        run: |
          set -u

          curl -fsS \
            --max-time 20 \
            -X POST \
            -H "Content-Type: application/json" \
            "$CALLBACK_URL" \
            -d "$(jq -n \
              --arg event "vpn_started" \
              --arg run_id "$RUN_ID" \
              --arg github_run_id "${GITHUB_RUN_ID}" \
              --arg mode "$(cat "$HOME/bale-vpn/xray-mode.txt" 2>/dev/null || echo DIRECT)" \
              --arg egress_ip "$(cat "$HOME/bale-vpn/active-egress-ip.txt" 2>/dev/null || echo unknown)" \
              '{
                event:$event,
                controller_run_id:$run_id,
                github_run_id:$github_run_id,
                mode:$mode,
                egress_ip:$egress_ip
              }')" \
            || echo "Controller callback failed."

      - name: Keep BaleVPN alive and self-renew
        shell: bash
        run: |
          set -u

          cd "$HOME/bale-vpn"

          PID="$(cat bale-vpn.pid)"

          START="$(date +%s)"

          RENEW_AFTER=15000
          END_AFTER=16200

          NEXT_SCHEDULED=0

          dispatch_next() {
            REPO="${GITHUB_REPOSITORY}"
            REF="${GITHUB_REF_NAME}"
            GH_TOKEN="${GITHUB_TOKEN:-${{ github.token }}}"

            ./log.sh INFO \
              "Preparing self-renewal dispatch."

            WORKFLOW_ID="$(
              curl -fsS \
                --max-time 20 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/repos/${REPO}/actions/workflows" |
              jq -er '
                .workflows[]
                | select(.name == "BaleVPN Server")
                | .id
              ' |
              head -n 1
            )" || {
              ./log.sh ERROR \
                "Could not find BaleVPN Server workflow."
              return 1
            }

            jq -n \
              --arg ref "$REF" \
              --arg controller_run_id "${{ inputs.controller_run_id }}" \
              --arg controller_callback_url "${{ inputs.controller_callback_url }}" \
              '{
                ref:$ref,
                inputs:{
                  controller_run_id:$controller_run_id,
                  controller_callback_url:$controller_callback_url
                }
              }' \
              > /tmp/next-run.json

            HTTP_CODE="$(
              curl -sS \
                --output /tmp/dispatch-response.json \
                --write-out '%{http_code}' \
                --max-time 30 \
                -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                -H "Content-Type: application/json" \
                "https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches" \
                --data @/tmp/next-run.json
            )"

            if [ "$HTTP_CODE" != "204" ] &&
               [ "$HTTP_CODE" != "200" ]; then

              ./log.sh ERROR \
                "Self-renewal dispatch failed. HTTP ${HTTP_CODE}."

              cat /tmp/dispatch-response.json || true

              return 1
            fi

            ./log.sh INFO \
              "Next BaleVPN Runner successfully dispatched."

            return 0
          }

          while true; do
            NOW="$(date +%s)"
            ELAPSED=$((NOW - START))

            if ! kill -0 "$PID" 2>/dev/null; then
              ./log.sh ERROR \
                "BaleVPN process stopped unexpectedly."

              if [ "$NEXT_SCHEDULED" -eq 0 ]; then
                ./log.sh INFO \
                  "Scheduling next Runner before exiting."

                if dispatch_next; then
                  NEXT_SCHEDULED=1
                fi
              fi

              echo "----- BaleVPN log -----"
              tail -n 200 bale-vpn.log 2>/dev/null || true

              exit 1
            fi

            MODE="$(cat xray-mode.txt 2>/dev/null || echo DIRECT)"

            if [ "$MODE" != "DIRECT" ] &&
               [ -f xray.pid ]; then

              XPID="$(cat xray.pid 2>/dev/null || true)"

              if [ -n "$XPID" ] &&
                 ! kill -0 "$XPID" 2>/dev/null; then

                ./log.sh WARN \
                  "Xray ${MODE} process stopped."

                ./log.sh INFO \
                  "Disabling Xray and falling back to DIRECT mode."

                ip link delete xray0 2>/dev/null || true

                DEFAULT_ROUTE="$(cat default-route.txt 2>/dev/null || true)"

                if [ -n "$DEFAULT_ROUTE" ]; then
                  ip route replace $DEFAULT_ROUTE 2>/dev/null || true
                fi

                rm -f xray.pid

                printf '%s' "DIRECT" > xray-mode.txt

                ./log.sh INFO \
                  "DIRECT fallback is now active; BaleVPN remains running."

                DIRECT_IP=""

                for URL in \
                  "https://api.ipify.org" \
                  "https://ifconfig.me/ip" \
                  "https://icanhazip.com"
                do
                  VALUE="$(
                    curl -4 \
                      -fsS \
                      --connect-timeout 5 \
                      --max-time 15 \
                      "$URL" 2>/dev/null |
                    tr -d '[:space:]' || true
                  )"

                  if echo "$VALUE" |
                     grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
                    DIRECT_IP="$VALUE"
                    break
                  fi
                done

                if [ -z "$DIRECT_IP" ]; then
                  DIRECT_IP="unknown"
                fi

                printf '%s' "$DIRECT_IP" > active-egress-ip.txt

                ./log.sh INFO \
                  "DIRECT fallback egress IP: ${DIRECT_IP}."
              fi
            fi

            if [ "$NEXT_SCHEDULED" -eq 0 ] &&
               [ "$ELAPSED" -ge "$RENEW_AFTER" ]; then

              if dispatch_next; then
                NEXT_SCHEDULED=1
              else
                ./log.sh WARN \
                  "Self-renewal failed; retrying in 30 seconds."
              fi
            fi

            if [ "$ELAPSED" -ge "$END_AFTER" ]; then

              if [ "$NEXT_SCHEDULED" -eq 0 ]; then
                ./log.sh INFO \
                  "Runtime limit reached. Dispatching next Runner."

                if dispatch_next; then
                  NEXT_SCHEDULED=1
                fi
              fi

              ./log.sh INFO \
                "Scheduled runtime finished."

              break
            fi

            sleep 30
          done

      - name: Ensure Next BaleVPN Runner
        if: always()
        shell: bash
        run: |
          set -u

          cd "$HOME/bale-vpn" 2>/dev/null || exit 0

          if [ -f next-run-dispatched ]; then
            ./log.sh INFO \
              "Next Runner was already dispatched."
            exit 0
          fi

          if [ -f next-run-failed ]; then
            ./log.sh WARN \
              "Previous self-renewal attempt failed. Performing final dispatch attempt."
          else
            ./log.sh INFO \
              "Performing final next-Runner safety dispatch."
          fi

          REPO="${GITHUB_REPOSITORY}"
          REF="${GITHUB_REF_NAME}"
          GH_TOKEN="${GITHUB_TOKEN:-${{ github.token }}}"

          WORKFLOW_ID="$(
            curl -fsS \
              --max-time 20 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${REPO}/actions/workflows" |
            jq -er '
              .workflows[]
              | select(.name == "BaleVPN Server")
              | .id
            ' |
            head -n 1
          )" || {
            ./log.sh ERROR \
              "Final safety dispatch could not find workflow."
            exit 0
          }

          jq -n \
            --arg ref "$REF" \
            --arg controller_run_id "${{ inputs.controller_run_id }}" \
            --arg controller_callback_url "${{ inputs.controller_callback_url }}" \
            '{
              ref:$ref,
              inputs:{
                controller_run_id:$controller_run_id,
                controller_callback_url:$controller_callback_url
              }
            }' \
            > /tmp/final-next-run.json

          HTTP_CODE="$(
            curl -sS \
              --output /tmp/final-dispatch-response.json \
              --write-out '%{http_code}' \
              --max-time 30 \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches" \
              --data @/tmp/final-next-run.json
          )"

          if [ "$HTTP_CODE" = "204" ] ||
             [ "$HTTP_CODE" = "200" ]; then

            touch next-run-dispatched

            ./log.sh INFO \
              "Final safety dispatch succeeded."

          else
            touch next-run-failed

            ./log.sh ERROR \
              "Final safety dispatch failed. HTTP ${HTTP_CODE}."

            cat /tmp/final-dispatch-response.json || true
          fi

      - name: Stop BaleVPN and Xray
        if: always()
        shell: bash
        run: |
          cd "$HOME/bale-vpn" 2>/dev/null || exit 0

          ./log.sh INFO \
            "Stopping BaleVPN/Xray processes."

          if [ -f bale-vpn.pid ]; then
            PID="$(cat bale-vpn.pid 2>/dev/null || true)"

            if [ -n "$PID" ] &&
               kill -0 "$PID" 2>/dev/null; then

              kill "$PID" 2>/dev/null || true

              for i in {1..20}; do
                kill -0 "$PID" 2>/dev/null || break
                sleep 1
              done

              kill -9 "$PID" 2>/dev/null || true
            fi
          fi

          if [ -f xray.pid ]; then
            XPID="$(cat xray.pid 2>/dev/null || true)"

            if [ -n "$XPID" ]; then
              kill "$XPID" 2>/dev/null || true
              sleep 2
              kill -9 "$XPID" 2>/dev/null || true
            fi
          fi

          ip link delete xray0 2>/dev/null || true

          DEFAULT_ROUTE="$(cat default-route.txt 2>/dev/null || true)"

          if [ -n "$DEFAULT_ROUTE" ]; then
            ip route replace $DEFAULT_ROUTE 2>/dev/null || true
          fi

      - name: Notify Controller - VPN Stopped
        if: ${{ always() && inputs.controller_callback_url != '' }}
        shell: bash
        env:
          CALLBACK_URL: ${{ inputs.controller_callback_url }}
          RUN_ID: ${{ inputs.controller_run_id }}
        run: |
          curl -fsS \
            --max-time 20 \
            -X POST \
            -H "Content-Type: application/json" \
            "$CALLBACK_URL" \
            -d "$(jq -n \
              --arg event "vpn_stopped" \
              --arg run_id "$RUN_ID" \
              --arg github_run_id "${GITHUB_RUN_ID}" \
              --arg mode "$(cat "$HOME/bale-vpn/xray-mode.txt" 2>/dev/null || echo DIRECT)" \
              --arg egress_ip "$(cat "$HOME/bale-vpn/active-egress-ip.txt" 2>/dev/null || echo unknown)" \
              '{
                event:$event,
                controller_run_id:$run_id,
                github_run_id:$github_run_id,
                mode:$mode,
                egress_ip:$egress_ip
              }')" \
            || echo "Controller callback failed."

      - name: Show detailed logs
        if: always()
        shell: bash
        run: |
          cd "$HOME/bale-vpn" 2>/dev/null || exit 0

          echo "========================================"
          echo "===== FINAL NETWORK MODE ==============="
          echo "========================================"

          cat xray-mode.txt 2>/dev/null || echo "unknown"

          echo
          echo "===== RUNNER PUBLIC IP =================="
          cat ../bale-vpn/controller_callback_url 2>/dev/null >/dev/null || true

          echo
          echo "===== ACTIVE EGRESS IP =================="
          cat active-egress-ip.txt 2>/dev/null || echo "unknown"

          echo
          echo "===== BALEVPN LOG ======================="
          tail -n 200 bale-vpn.log 2>/dev/null || true

          echo
          echo "===== XRAY RUNTIME LOG =================="
          tail -n 200 xray-runtime.log 2>/dev/null || true

          echo
          echo "===== XRAY ERROR LOG ===================="
          tail -n 200 xray-error.log 2>/dev/null || true

          echo
          echo "===== XRAY ACCESS LOG ==================="
          tail -n 100 xray-access.log 2>/dev/null || true

          echo
          echo "===== ROUTING TABLE ====================="
          ip -4 route 2>/dev/null || true

          echo
          echo "===== PROCESSES ========================="
          ps aux | grep -E 'bale-vpn|xray' | grep -v grep || true
