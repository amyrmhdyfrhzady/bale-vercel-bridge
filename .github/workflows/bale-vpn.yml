name: BaleVPN Server

on:
  workflow_dispatch:
    inputs:
      controller_run_id:
        description: "Controller run ID"
        required: false
        type: string
      controller_callback_url:
        description: "Controller callback URL"
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: bale-vpn-server
  cancel-in-progress: false

jobs:
  bale-vpn:
    name: BaleVPN Server
    runs-on: ubuntu-latest
    timeout-minutes: 290

    steps:
      - name: Prepare
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq unzip iproute2
          mkdir -p "$HOME/bale-vpn"
          cd "$HOME/bale-vpn"

          printf '%s' '${{ inputs.controller_callback_url }}' > controller_callback_url
          printf '%s' '${{ inputs.controller_run_id }}' > controller_run_id

          chmod 600 controller_callback_url controller_run_id

          cat > log.sh <<'LOG'
          #!/usr/bin/env bash

          set -u

          LEVEL="${1:-INFO}"
          shift || true

          MESSAGE="$*"
          TS="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          echo "[${TS}] [${LEVEL}] ${MESSAGE}"

          CALLBACK_URL="$(cat "$HOME/bale-vpn/controller_callback_url" 2>/dev/null || true)"
          RUN_ID="$(cat "$HOME/bale-vpn/controller_run_id" 2>/dev/null || true)"

          if [ -n "$CALLBACK_URL" ]; then
            jq -n \
              --arg event "runner_log" \
              --arg level "$LEVEL" \
              --arg message "${MESSAGE:0:3500}" \
              --arg run_id "$RUN_ID" \
              --arg github_run_id "${GITHUB_RUN_ID:-}" \
              '{
                event:$event,
                level:$level,
                message:$message,
                controller_run_id:$run_id,
                github_run_id:$github_run_id
              }' |
            curl -fsS \
              --max-time 15 \
              -X POST \
              -H 'Content-Type: application/json' \
              "$CALLBACK_URL" \
              -d @- \
              >/dev/null 2>&1 || true
          fi
          LOG

          chmod 700 log.sh

          ./log.sh INFO "Runner prepared. GitHub run ${GITHUB_RUN_ID}."

      - name: Download BaleVPN
        shell: bash
        run: |
          set -e

          cd "$HOME/bale-vpn"

          VERSION="v2.1.2"

          ./log.sh INFO "Downloading BaleVPN ${VERSION}."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/kookoo1sabzy/BaleVPN/releases/download/${VERSION}/bale-vpn-headless-linux-x86_64" \
            -o bale-vpn-headless-linux-x86_64

          chmod +x bale-vpn-headless-linux-x86_64

          ./bale-vpn-headless-linux-x86_64 --help >/dev/null 2>&1 || true

          ./log.sh INFO "BaleVPN binary ready."

      - name: Download Xray Client
        shell: bash
        run: |
          set -u

          cd "$HOME/bale-vpn"

          XRAY_VERSION="v26.9.9"

          ./log.sh INFO "Downloading Xray-core ${XRAY_VERSION}."

          if curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" \
            -o xray.zip &&
            unzip -o -q xray.zip xray; then

            chmod +x xray

            if ./xray version; then
              printf '%s' "1" > xray-available
              ./log.sh INFO "Xray binary ready."
            else
              printf '%s' "0" > xray-available
              ./log.sh WARN "Xray binary failed version check. DIRECT mode will be used."
            fi

          else
            printf '%s' "0" > xray-available
            ./log.sh WARN "Xray download failed. DIRECT mode will be used and BaleVPN will continue."
          fi

      - name: Create BaleVPN config
        shell: bash
        env:
          RUNNER_TOKEN_SECRET: ${{ secrets.RUNNER_TOKEN_SECRET }}
        run: |
          set -e

          cd "$HOME/bale-vpn"

          ./log.sh INFO "Requesting BaleVPN access token from controller."

          BALE_ACCESS_TOKEN="$(
            curl -fsS \
              --max-time 20 \
              -H "Authorization: Bearer ${RUNNER_TOKEN_SECRET}" \
              "https://balevpncontroller.agkirusu4su5s.workers.dev/runner/token" |
              jq -er '.token'
          )"

          if [ -z "$BALE_ACCESS_TOKEN" ]; then
            ./log.sh ERROR "Could not retrieve BaleVPN access token."
            exit 1
          fi

          cat > .bale-vpn_config.json <<EOF
          {
            "token": "${BALE_ACCESS_TOKEN}",
            "mode": "server",
            "natMode": "userspace",
            "port": 3001,
            "socks5Port": 1080,
            "admission": ["34568984","1888899708"],
            "blacklist": [],
            "maxClients": 5
          }
          EOF

          chmod 600 .bale-vpn_config.json

          ./log.sh INFO "BaleVPN configuration created."

      - name: Get Runner IP
        id: runner-ip
        shell: bash
        run: |
          set -u

          cd "$HOME/bale-vpn"

          IP=""

          for URL in \
            "https://api.ipify.org" \
            "https://ifconfig.me/ip" \
            "https://icanhazip.com"
          do
            ./log.sh INFO "Trying public IPv4 endpoint: ${URL}"

            VALUE="$(
              curl -4 -fsS \
                --connect-timeout 5 \
                --max-time 15 \
                "$URL" 2>/dev/null |
              tr -d '[:space:]' || true
            )"

            if echo "$VALUE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
              IP="$VALUE"
              break
            fi
          done

          if [ -z "$IP" ]; then
            ./log.sh WARN "Could not determine Runner public IPv4. Continuing anyway."
            IP="unknown"
          fi

          echo "ip=$IP" >> "$GITHUB_OUTPUT"

          echo "Runner IPv4: $IP"

          ./log.sh INFO "Runner public IPv4: ${IP}."

      - name: Notify Controller - Runner Ready
        if: ${{ inputs.controller_callback_url != '' }}
        shell: bash
        env:
          CALLBACK_URL: ${{ inputs.controller_callback_url }}
          RUN_ID: ${{ inputs.controller_run_id }}
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          set -u

          curl -fsS \
            --max-time 20 \
            -X POST \
            -H "Content-Type: application/json" \
            "$CALLBACK_URL" \
            -d "$(jq -n \
              --arg event "runner_ready" \
              --arg run_id "$RUN_ID" \
              --arg ip "$RUNNER_IP" \
              --arg github_run_id "${GITHUB_RUN_ID}" \
              '{
                event:$event,
                controller_run_id:$run_id,
                github_run_id:$github_run_id,
                ip:$ip
              }')" \
            || echo "Controller callback failed."

