                  "2620:fe::fe",
                  "2620:fe::9"
                ],
                "domain:googleapis.cn": "googleapis.com",
                "dot.pub": [
                  "1.12.12.12",
                  "120.53.53.53"
                ],
                "one.one.one.one": [
                  "1.1.1.1",
                  "1.0.0.1",
                  "2606:4700:4700::1111",
                  "2606:4700:4700::1001"
                ],
                "www.wto.org": [
                  "172.64.146.66",
                  "104.18.41.190"
                ]
              },
              "queryStrategy": "UseIPv4",
              "servers": [
                "1.1.1.1"
              ]
            },
            "inbounds": [
              {
                "listen": "127.0.0.1",
                "port": 58256,
