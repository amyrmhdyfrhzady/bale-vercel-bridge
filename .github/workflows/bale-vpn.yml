                  "2400:3200:baba::1"
                ],
                "dns.cloudflare.com": [
                  "104.16.132.229",
                  "104.16.133.229",
                  "2606:4700::6810:84e5",
                  "2606:4700::6810:85e5"
                ],
                "dns.google": [
