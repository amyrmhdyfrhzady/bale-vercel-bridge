name: BaleVPN Server

on:
  workflow_dispatch:
    inputs:
      controller_run_id:
        description: "Controller run ID"
        required: false
        type: string
      controller_callback_url:
        description: "Controller callback URL"
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: bale-vpn-server
  cancel-in-progress: false

jobs:
  bale-vpn:
    name: BaleVPN Server
    runs-on: ubuntu-latest
    timeout-minutes: 290

    steps:
      - name: Prepare
        shell: bash
        run: |
          set -e

          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq

          mkdir -p "$HOME/bale-vpn"
          cd "$HOME/bale-vpn"

      - name: Download BaleVPN
        shell: bash
        run: |
          set -e
          cd "$HOME/bale-vpn"

          VERSION="v2.1.2"

          curl -fL \
            "https://github.com/kookoo1sabzy/BaleVPN/releases/download/${VERSION}/bale-vpn-headless-linux-x86_64" \
            -o bale-vpn-headless-linux-x86_64

          chmod +x bale-vpn-headless-linux-x86_64

          ./bale-vpn-headless-linux-x86_64 --help >/dev/null 2>&1 || true

      - name: Create BaleVPN config
        shell: bash
        env:
          RUNNER_TOKEN_SECRET: ${{ secrets.RUNNER_TOKEN_SECRET }}
        run: |
          set -e
          cd "$HOME/bale-vpn"

          BALE_ACCESS_TOKEN="$(
            curl -fsS \
              --max-time 20 \
              -H "Authorization: Bearer ${RUNNER_TOKEN_SECRET}" \
              "https://balevpncontroller.agkirusu4su5s.workers.dev/runner/token" |
              jq -er '.token'
          )"

          if [ -z "$BALE_ACCESS_TOKEN" ]; then
            echo "ERROR: Could not retrieve BALE_ACCESS_TOKEN from Controller."
            exit 1
          fi

          cat > .bale-vpn_config.json <<EOF
          {
            "token": "${BALE_ACCESS_TOKEN}",
            "mode": "server",
            "natMode": "userspace",
            "port": 3001,
            "socks5Port": 1080,
            "admission": ["34568984","1888899708"],
            "blacklist": [],
            "maxClients": 5
          }
          EOF

          chmod 600 .bale-vpn_config.json

      - name: Get Runner IP
        id: runner-ip
        shell: bash
        run: |
          set -e

          IP="$(curl -4 -fsS --max-time 15 https://api.ipify.org)"

          if ! echo "$IP" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Could not determine public IPv4."
            exit 1
          fi

          echo "ip=$IP" >> "$GITHUB_OUTPUT"

          echo "Runner IPv4: $IP"

      - name: Notify Controller - Runner Ready
        if: ${{ inputs.controller_callback_url != '' }}
        shell: bash
        env:
          CALLBACK_URL: ${{ inputs.controller_callback_url }}
          RUN_ID: ${{ inputs.controller_run_id }}
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          set -e

          curl -fsS \
            --max-time 20 \
            -X POST \
            -H "Content-Type: application/json" \
            "$CALLBACK_URL" \
            -d "$(jq -n \
              --arg event "runner_ready" \
              --arg run_id "$RUN_ID" \
              --arg ip "$RUNNER_IP" \
              --arg github_run_id "${GITHUB_RUN_ID}" \
              '{
                event: $event,
                controller_run_id: $run_id,
                github_run_id: $github_run_id,
                ip: $ip
              }')" \
            || echo "Controller callback failed."

      - name: Start BaleVPN
        id: balevpn
        shell: bash
        run: |
          set -e
          cd "$HOME/bale-vpn"

          echo "Starting BaleVPN server..."

          ./bale-vpn-headless-linux-x86_64 server \
            --nat-mode userspace \
            > bale-vpn.log 2>&1 &

          PID=$!
          echo "$PID" > bale-vpn.pid

          sleep 8

          if ! kill -0 "$PID" 2>/dev/null; then
            echo "BaleVPN failed to start."
            echo "----- BaleVPN log -----"
            cat bale-vpn.log || true
            exit 1
          fi

          echo "BaleVPN started."
          echo "PID: $PID"

      - name: Notify Controller - VPN Started
        if: ${{ inputs.controller_callback_url != '' }}
        shell: bash
        env:
          CALLBACK_URL: ${{ inputs.controller_callback_url }}
          RUN_ID: ${{ inputs.controller_run_id }}
        run: |
          set -e

          curl -fsS \
            --max-time 20 \
            -X POST \
            -H "Content-Type: application/json" \
            "$CALLBACK_URL" \
            -d "$(jq -n \
              --arg event "vpn_started" \
              --arg run_id "$RUN_ID" \
              --arg github_run_id "${GITHUB_RUN_ID}" \
              '{
                event: $event,
                controller_run_id: $run_id,
                github_run_id: $github_run_id
              }')" \
            || echo "Controller callback failed."

      - name: Keep BaleVPN alive
        shell: bash
        run: |
          set -e
          cd "$HOME/bale-vpn"

          PID="$(cat bale-vpn.pid)"

          # Approximately 4h30m.
          END=$(( $(date +%s) + 16200 ))

          while [ "$(date +%s)" -lt "$END" ]; do

            if ! kill -0 "$PID" 2>/dev/null; then
              echo "BaleVPN process stopped unexpectedly."

              echo "----- BaleVPN log -----"
              tail -n 200 bale-vpn.log || true

              exit 1
            fi

            sleep 30
          done

          echo "Scheduled runtime finished."

      - name: Start Next BaleVPN Runner
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_RUN_ID: ${{ inputs.controller_run_id }}
          CONTROLLER_CALLBACK_URL: ${{ inputs.controller_callback_url }}
        run: |
          set -e

          REPO="${GITHUB_REPOSITORY}"
          REF="${GITHUB_REF_NAME}"

          echo "Preparing next BaleVPN Runner..."
          echo "Repository: ${REPO}"
          echo "Ref: ${REF}"

          WORKFLOW_ID="$(
            curl -fsS \
              --max-time 20 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${REPO}/actions/workflows" |
            jq -er '
              .workflows[]
              | select(.name == "BaleVPN Server")
              | .id
            ' |
            head -n 1
          )"

          if [ -z "$WORKFLOW_ID" ]; then
            echo "ERROR: BaleVPN Server workflow was not found."
            exit 1
          fi

          echo "Workflow ID: ${WORKFLOW_ID}"

          jq -n \
            --arg ref "$REF" \
            --arg controller_run_id "$CONTROLLER_RUN_ID" \
            --arg controller_callback_url "$CONTROLLER_CALLBACK_URL" \
            '{
              ref: $ref,
              inputs: {
                controller_run_id: $controller_run_id,
                controller_callback_url: $controller_callback_url
              }
            }' > /tmp/next-run.json

          echo "Dispatching next BaleVPN Runner..."

          HTTP_CODE="$(
            curl -sS \
              --output /tmp/dispatch-response.json \
              --write-out "%{http_code}" \
              --max-time 30 \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW_ID}/dispatches" \
              --data @/tmp/next-run.json
          )"

          if [ "$HTTP_CODE" != "204" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Failed to dispatch next Runner."
            echo "HTTP status: $HTTP_CODE"
            echo "Response:"
            cat /tmp/dispatch-response.json || true
            exit 1
          fi

          echo "Next BaleVPN Runner successfully dispatched."

      - name: Stop BaleVPN
        if: always()
        shell: bash
        run: |
          cd "$HOME/bale-vpn" 2>/dev/null || exit 0

          if [ -f bale-vpn.pid ]; then
            PID="$(cat bale-vpn.pid)"

            if kill -0 "$PID" 2>/dev/null; then
              echo "Stopping BaleVPN..."

              kill "$PID" || true

              for i in {1..20}; do
                if ! kill -0 "$PID" 2>/dev/null; then
                  break
                fi

                sleep 1
              done

              kill -9 "$PID" 2>/dev/null || true
            fi
          fi

      - name: Notify Controller - VPN Stopped
        if: ${{ always() && inputs.controller_callback_url != '' }}
        shell: bash
        env:
          CALLBACK_URL: ${{ inputs.controller_callback_url }}
          RUN_ID: ${{ inputs.controller_run_id }}
        run: |
          curl -fsS \
            --max-time 20 \
            -X POST \
            -H "Content-Type: application/json" \
            "$CALLBACK_URL" \
            -d "$(jq -n \
              --arg event "vpn_stopped" \
              --arg run_id "$RUN_ID" \
              --arg github_run_id "${GITHUB_RUN_ID}" \
              '{
                event: $event,
                controller_run_id: $run_id,
                github_run_id: $github_run_id
              }')" \
            || echo "Controller callback failed."

      - name: Show BaleVPN log
        if: always()
        shell: bash
        run: |
          if [ -f "$HOME/bale-vpn/bale-vpn.log" ]; then
            echo "----- Last BaleVPN log lines -----"
            tail -n 200 "$HOME/bale-vpn/bale-vpn.log"
          fi
